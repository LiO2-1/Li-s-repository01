<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 无序列表 -->
     <ul>
        <h1>目录</h1>
        <li>列表条目01</li>
        <li>列表条目02</li>
        <li>列表条目03</li>
     </ul>

     <!-- 有序列表 -->
      <ol>
        <h1>目录</h1>
        <li>列表条目01</li>
        <li>列表条目02</li>
        <li>列表条目03</li>
      </ol>

      <!-- 自定义列表 -->
       <dl>
        <h1>目录</h1>
        <dt>题目</dt>
        <dd>内容01</dd>
        <dd>内容02</dd>
        <dd>内容03</dd>
        <dt>题目</dt>
        <dd>内容01</dd>
        <dd>内容02</dd>
        <dd>内容03</dd> 
       </dl>
</body>
</html>
